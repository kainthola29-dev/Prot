<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="art-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="50%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="card-art-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#art-grad-1)" />

  <g transform="translate(140, 60)">
    <rect width="520" height="340" rx="24" fill="url(#card-art-1)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    
    <rect x="30" y="28" width="140" height="26" rx="13" fill="rgba(16, 185, 129, 0.3)" stroke="#34D399" stroke-width="1" />
    <text x="100" y="45" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">EXECUTIVE ESSAY</text>

    <text x="30" y="95" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">ACTIVITY VS STRATEGY</text>
    <text x="30" y="122" fill="#99F6E4" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Why Modern Marketing Confuses Motion With Progress</text>

    <!-- Comparison matrix diagram -->
    <g transform="translate(30, 150)">
      <!-- Box Left: Activity -->
      <rect width="215" height="130" rx="12" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.4)" />
      <text x="20" y="30" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12" font-weight="700">ACTIVITY-DRIVEN</text>
      <text x="20" y="55" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Vanity impression chasing</text>
      <text x="20" y="75" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• 20 tactical posts/week</text>
      <text x="20" y="95" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Reactive budget spend</text>

      <!-- Box Right: Strategy -->
      <g transform="translate(240, 0)">
        <rect width="215" height="130" rx="12" fill="rgba(16, 185, 129, 0.2)" stroke="rgba(16, 185, 129, 0.5)" />
        <text x="20" y="30" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">STRATEGY-DRIVEN</text>
        <text x="20" y="55" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11">• Lower customer acquisition cost</text>
        <text x="20" y="75" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11">• Sustainable brand moat</text>
        <text x="20" y="95" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11">• Direct commercial ROI</text>
      </g>
    </g>
  </g>
</svg>