<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Tag Pill -->
  <rect x="80" y="80" width="280" height="40" rx="20" fill="#4338ca" opacity="0.8" />
  <text x="100" y="105" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">DIGITAL MARKETING 2027</text>

  <!-- Main Title -->
  <text x="80" y="200" fill="#ffffff" font-family="system-ui, sans-serif" font-size="48" font-weight="800" line-height="1.2">
    <tspan x="80" dy="0">Why Marketers Are Betting on</tspan>
    <tspan x="80" dy="62" fill="url(#accentGrad)">Human-First Content</tspan>
    <tspan x="80" dy="62">After the AI Ad Backlash</tspan>
  </text>

  <!-- Subtitle / Stats -->
  <text x="80" y="380" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="22" font-weight="400">
    <tspan x="80" dy="0">Brandwatch 2027 Trends Report: 71% of marketers prioritize human authenticity</tspan>
    <tspan x="80" dy="32">as public backlash against synthetic AI ads rises by 240%.</tspan>
  </text>

  <!-- Stat Badges -->
  <g transform="translate(80, 480)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="220" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="24" y="42" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="32" font-weight="800">+240%</text>
    <text x="24" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">AI Ad Criticism Surge</text>

    <!-- Badge 2 -->
    <rect x="250" y="0" width="220" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="274" y="42" fill="#10b981" font-family="system-ui, sans-serif" font-size="32" font-weight="800">71%</text>
    <text x="274" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Bet on Human Content</text>

    <!-- Badge 3 -->
    <rect x="500" y="0" width="240" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="524" y="42" fill="#6366f1" font-family="system-ui, sans-serif" font-size="32" font-weight="800">106M+</text>
    <text x="524" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Conversations Analyzed</text>
  </g>

  <!-- Author Signature -->
  <text x="80" y="620" fill="#64748b" font-family="system-ui, sans-serif" font-size="16" font-weight="600">
    Analysis &amp; Field Strategy by Deepanshu Kainthola | Marketing Specialist
  </text>
</svg>
