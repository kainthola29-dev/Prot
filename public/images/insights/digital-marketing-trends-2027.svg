<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1000" cy="150" r="300" fill="#38bdf8" opacity="0.08" filter="blur(60px)"/>
  <circle cx="200" cy="500" r="250" fill="#6366f1" opacity="0.08" filter="blur(60px)"/>
  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="110" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" text-anchor="middle">STRATEGIC FORECAST</text>
    
    <text x="0" y="110" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Digital Marketing</text>
    <text x="0" y="175" fill="url(#accent)" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Trends 2027 in India</text>
    
    <text x="0" y="240" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">What is real, what is hype, and how to prepare your brands.</text>
    
    <line x1="0" y1="290" x2="400" y2="290" stroke="#334155" stroke-width="2"/>
    <text x="0" y="330" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">DEEPANSHU KAINTHOLA · MARKETING STRATEGIST</text>
