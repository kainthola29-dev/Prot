<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bg-grad-2)" />

  <circle cx="200" cy="140" r="160" fill="#8B5CF6" opacity="0.3" filter="url(#glow2)" />
  <circle cx="650" cy="350" r="180" fill="#3B82F6" opacity="0.25" filter="url(#glow2)" />

  <!-- Center Card UI: Social Media Recruitment Funnel -->
  <g transform="translate(180, 75)">
    <rect width="440" height="280" rx="20" fill="url(#card-grad-2)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    
    <rect x="24" y="24" width="110" height="24" rx="12" fill="rgba(139, 92, 246, 0.3)" stroke="#A78BFA" stroke-width="1" />
    <text x="79" y="40" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">GROWTH ENGINE</text>

    <text x="24" y="90" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">JUST JOB RECRUITMENT</text>
    <text x="24" y="114" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Social Acquisition &amp; High-Volume Inflow</text>

    <!-- Funnel Visualization Chart -->
    <g transform="translate(24, 140)">
      <rect width="392" height="100" rx="12" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.08)" />
      
      <!-- Bars / Metric Indicators -->
      <g transform="translate(24, 20)">
        <text x="0" y="14" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="12" font-weight="700">META &amp; LINKEDIN ACQUISITION</text>
        <rect x="0" y="24" width="344" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
        <rect x="0" y="24" width="280" height="8" rx="4" fill="url(#bg-grad-2)" stroke="#C084FC" stroke-width="0.5" />
        
        <text x="0" y="52" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="500">High-converting mobile job applicant funnel</text>
      </g>
    </g>
  </g>

  <!-- Left Floating Badge -->
  <g transform="translate(60, 240)">
    <rect width="140" height="50" rx="25" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(167, 139, 250, 0.4)" stroke-width="1.5" />
    <circle cx="28" cy="25" r="14" fill="#7C3AED" />
    <text x="28" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">JJ</text>
    <text x="50" y="23" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">JUST JOB</text>
    <text x="50" y="36" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="9" font-weight="500">Talent Portal</text>
  </g>
</svg>