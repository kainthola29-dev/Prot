      <text x="24" y="58" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Oncologist Dialogues • Recovery Stories • YouTube Growth</text>
      <text x="24" y="80" fill="#E6FFFA" font-family="system-ui, sans-serif" font-size="11">Simplifying advanced oncology science into compassionate narratives</text>
