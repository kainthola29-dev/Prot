<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg-grad-1)" />

  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="680" cy="120" r="140" fill="#38BDF8" opacity="0.25" filter="url(#glow)" />
  <circle cx="160" cy="380" r="180" fill="#10B981" opacity="0.18" filter="url(#glow)" />

  <!-- Main Illustration: Live Event / Digital Campaign UI Card -->
  <g transform="translate(180, 70)">
    <!-- Main glass container -->
    <rect width="440" height="280" rx="20" fill="url(#card-grad)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    
    <!-- Header bar -->
    <rect x="24" y="24" width="80" height="24" rx="12" fill="rgba(16, 185, 129, 0.25)" stroke="#10B981" stroke-width="1" />
    <text x="64" y="40" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">LIVE EVENT</text>

    <rect x="114" y="24" width="90" height="24" rx="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="159" y="40" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">DEC 20, 2025</text>

    <!-- Badge in top right -->
    <circle cx="390" cy="36" r="6" fill="#10B981" />
    <circle cx="390" cy="36" r="12" fill="none" stroke="#10B981" opacity="0.6" stroke-width="1.5" />

    <!-- Title and Subtitle inside card -->
    <text x="24" y="90" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">EMPLOY INDIA CONNECT</text>
    <text x="24" y="114" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Nationwide Strategic Workforce Webinar</text>

    <!-- Graphic: Metrics Dashboard Row -->
    <g transform="translate(24, 140)">
      <!-- Metric Box 1 -->
      <rect width="120" height="70" rx="12" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.1)" />
      <text x="60" y="32" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle">850+</text>
      <text x="60" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">LIVE ATTENDEES</text>

      <!-- Metric Box 2 -->
      <g transform="translate(136, 0)">
        <rect width="120" height="70" rx="12" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.1)" />
        <text x="60" y="32" fill="#34D399" font-family="system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle">78%</text>
        <text x="60" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">WATCH RETENTION</text>
      </g>

      <!-- Metric Box 3 -->
      <g transform="translate(272, 0)">
        <rect width="120" height="70" rx="12" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.1)" />
        <text x="60" y="32" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle">4.8 / 5</text>
        <text x="60" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">FEEDBACK SCORE</text>
      </g>
    </g>

    <!-- Bottom footer pill -->
    <g transform="translate(24, 232)">
      <text x="0" y="16" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Keynote: Sandeep Chatterjee • Multi-Channel Digital Funnel</text>
    </g>
  </g>

  <!-- Floating UI pill left -->
  <g transform="translate(60, 200)">
    <rect width="140" height="48" rx="24" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <circle cx="28" cy="24" r="12" fill="#0284C7" />
    <path d="M24 24 L27 27 L33 21" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="48" y="22" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="700">CAMPAIGN LEAD</text>
    <text x="48" y="34" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9" font-weight="500">Vision India</text>
  </g>

  <!-- Floating UI pill right -->
  <g transform="translate(600, 310)">
    <rect width="150" height="48" rx="24" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />
    <circle cx="28" cy="24" r="12" fill="#10B981" />
    <path d="M28 18 L28 30 M22 24 L34 24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="48" y="22" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="700">PAN-INDIA</text>
    <text x="48" y="34" fill="#34D399" font-family="system-ui, sans-serif" font-size="9" font-weight="500">Tier-2/3 Reach</text>
  </g>
</svg>