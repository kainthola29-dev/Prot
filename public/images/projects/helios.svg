<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-helios" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042" />
      <stop offset="50%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="card-helios" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg-helios)" />

  <g transform="translate(180, 75)">
    <rect width="440" height="280" rx="20" fill="url(#card-helios)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <rect x="24" y="24" width="165" height="24" rx="12" fill="rgba(192, 132, 252, 0.3)" stroke="#C084FC" stroke-width="1" />
    <text x="106" y="40" fill="#F3E8FF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">EDUCATION &amp; WEB MEDIA</text>

    <text x="24" y="90" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">HELIOS EDUCORE MEDIA</text>
    <text x="24" y="114" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Digital Channels, Web Management &amp; EdTech Campaigns</text>

    <g transform="translate(24, 140)">
      <rect width="392" height="100" rx="12" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.08)" />
      <text x="24" y="34" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="12" font-weight="700">DIGITAL CONTENT MANAGEMENT</text>
      <text x="24" y="58" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Educational Video • Portal Traffic • Social Inbound</text>
      <text x="24" y="80" fill="#FAF5FF" font-family="system-ui, sans-serif" font-size="11">Structuring creative content funnels for career and competitive aspirants</text>
    </g>
  </g>
</svg>
