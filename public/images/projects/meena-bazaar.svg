<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-mb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E17" />
      <stop offset="50%" stop-color="#831843" />
      <stop offset="100%" stop-color="#310D20" />
    </linearGradient>
    <linearGradient id="card-mb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg-mb)" />

  <g transform="translate(180, 75)">
    <rect width="440" height="280" rx="20" fill="url(#card-mb)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <rect x="24" y="24" width="150" height="24" rx="12" fill="rgba(244, 63, 94, 0.3)" stroke="#FB7185" stroke-width="1" />
    <text x="99" y="40" fill="#FFE4E6" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">RETAIL FASHION VIDEO</text>

    <text x="24" y="90" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">MEENA BAZAAR FILMS</text>
    <text x="24" y="114" fill="#FBCFE8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Ethnic Couture, Model Shoots &amp; E-commerce Flatlays</text>

