      <text x="24" y="58" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Store Walkthroughs • Product Videos • Testimonials</text>
      <text x="24" y="80" fill="#FCE7F3" font-family="system-ui, sans-serif" font-size="11">Driving festive sales and social engagement with premium video</text>
