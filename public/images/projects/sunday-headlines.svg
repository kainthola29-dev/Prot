<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="card-sh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg-sh)" />

  <g transform="translate(180, 75)">
    <rect width="440" height="280" rx="20" fill="url(#card-sh)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <rect x="24" y="24" width="165" height="24" rx="12" fill="rgba(129, 140, 248, 0.3)" stroke="#A5B4FC" stroke-width="1" />
    <text x="106" y="40" fill="#E0E7FF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">NEWSROOM &amp; BROADCAST</text>

    <text x="24" y="90" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">THE SUNDAY HEADLINES</text>
    <text x="24" y="114" fill="#C7D2FE" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Fast-Paced Newsroom Direction &amp; Investigative Video</text>

    <g transform="translate(24, 140)">
      <rect width="392" height="100" rx="12" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.08)" />
      <text x="24" y="34" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="12" font-weight="700">HEAD OF MEDIA PRODUCTION</text>
      <text x="24" y="58" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Field Reporting • Multi-Cam Shoots • Video Editing Desk</text>
      <text x="24" y="80" fill="#EEF2FF" font-family="system-ui, sans-serif" font-size="11">Managing complete broadcast workflow from breaking news to delivery</text>
    </g>
  </g>
</svg>
